name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Project runtime. Laravel 13 declares php ^8.3, but Symfony 8 dependencies
  # and PHPUnit 13 (>=8.4.1) make 8.4 the real floor.
  PHP_VERSION: '8.4'

# Every external action is pinned to a full commit SHA, with the release in a
# trailing comment. A tag is a moving pointer: whoever can move `v2` can run
# their code in this workflow. The comment is for humans; the SHA is the
# contract. Re-resolve both when bumping, never edit the comment alone.
jobs:
  app:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, mbstring, xml, curl, zip, bcmath, intl
          coverage: none

      # PostgreSQL runs natively on the runner. Docker is deliberately not used
      # anywhere in this project, including CI: a service container here would
      # normalise Docker as a project dependency.
      - name: Start the runner's native PostgreSQL
        id: pg
        run: |
          set -euo pipefail
          if ! command -v pg_ctlcluster >/dev/null && ! command -v pg_isready >/dev/null; then
            echo "No PostgreSQL on this runner image; installing the distribution package."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql postgresql-client
          fi
          sudo systemctl start postgresql
          # The version is DETECTED, never assumed: if the runner image changes,
          # that surfaces here as visible output instead of a silent behaviour shift.
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 1; done
          SERVER_VERSION="$(sudo -u postgres psql -tAc 'show server_version')"
          echo "PostgreSQL server on this runner: ${SERVER_VERSION}"
          echo "server_version=${SERVER_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create the throwaway test role and database
        run: |
          set -euo pipefail
          # The role gets no CREATEDB, matching local development: the test
          # suite isolates itself in a schema it can create inside its own
          # database, not in a second database.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE purrenade LOGIN PASSWORD 'ci-only-not-a-secret';
          CREATE DATABASE purrenade OWNER purrenade;
          SQL

      - name: Install from the lockfile
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_PASSWORD: ci-only-not-a-secret

      - name: Formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Migrations
        run: php artisan migrate --force
        env:
          DB_PASSWORD: ci-only-not-a-secret

      - name: Tests
        run: vendor/bin/pest
        env:
          DB_PASSWORD: ci-only-not-a-secret

      - name: Migrations run from an empty database
        run: |
          set -euo pipefail
          # `migrate` above proved the incremental path. This proves a fresh
          # install, which is what a new environment actually does — and it runs
          # in the test schema, so it cannot disturb the data the suite created.
          DB_SEARCH_PATH=purrenade_test php artisan migrate:fresh --force
        env:
          DB_PASSWORD: ci-only-not-a-secret

      - name: Configuration and routes survive caching
        run: |
          set -euo pipefail
          # Both caches change how the application resolves values, and both
          # fail only in production if they fail at all: `config:cache` stops
          # .env being read, and `route:cache` cannot serialise a closure route.
          php artisan config:cache
          php artisan route:cache
          php artisan route:list --json > /dev/null
          php artisan config:clear
          php artisan route:clear
          echo "config and route caches build and clear cleanly"
        env:
          DB_PASSWORD: ci-only-not-a-secret

      - name: Authentication secrets are never logged
        run: |
          set -euo pipefail
          # This gate rested on a premise that was not true.
          #
          # It claimed `App\Support\AuthLog` was the only writer to the security
          # channel and then grepped for `AuthLog::` alone — so anything logging
          # by another route was invisible to it, and `App\Support\BreachCheck`
          # already does exactly that. It also matched on one line only (Pint
          # wraps long calls), on five literal variable names, and in `app/` only.
          #
          # Checked from both directions now: every writer to the channel is
          # known, and no logging call anywhere passes a credential-shaped value.
          python3 - <<'EOF'
          import pathlib, re, sys

          ALLOWED_WRITERS = {'app/Support/AuthLog.php', 'app/Support/BreachCheck.php'}

          # A credential is a *variable* holding one, or an array *key* naming
          # one. Not a string value: `'method' => 'recovery_code'` is a label
          # saying which factor was used, and flagging it taught nobody anything.
          CREDENTIAL = re.compile(
              r"\$(password|passwd|pwd|secret|otp|plaintext|recovery_?code|current_password|new_password)\w*"
              r"|['\"](password|current_password|new_password|password_confirmation|recovery_code|two_factor_secret|plain_?text_token)['\"]\s*=>",
              re.I,
          )
          LOG_CALL = re.compile(r"(?:Log::|AuthLog::|logger\(\)->|->log\()", re.I)

          def log_calls(text):
              """Each logging call as one string, however many lines it spans."""
              lines = text.splitlines()

              for index, line in enumerate(lines):
                  if not LOG_CALL.search(line):
                      continue

                  call = line
                  depth = call.count('(') - call.count(')')
                  cursor = index

                  while depth > 0 and cursor + 1 < len(lines):
                      cursor += 1
                      call += ' ' + lines[cursor].strip()
                      depth += lines[cursor].count('(') - lines[cursor].count(')')

                  yield index + 1, call

          sources = [p for d in ('app', 'routes', 'config', 'database') for p in pathlib.Path(d).rglob('*.php')]

          unknown_writers, leaks = [], []

          for path in sources:
              text = path.read_text(encoding='utf-8')

              if "channel('security')" in text and str(path) not in ALLOWED_WRITERS:
                  unknown_writers.append(str(path))

              for line_number, call in log_calls(text):
                  if CREDENTIAL.search(call):
                      leaks.append(f'{path}:{line_number}: {call.strip()[:120]}')

          if unknown_writers:
              print('ERROR: unrecognised writer to the security channel:')
              for w in unknown_writers:
                  print('  ', w)
              print('Add it to ALLOWED_WRITERS here only after checking it logs no credential.')
              sys.exit(1)

          if leaks:
              print('ERROR: a credential-shaped value appears in a logging call:')
              for leak in leaks:
                  print('  ', leak)
              sys.exit(1)

          print(f'no credential reaches any log; {len(ALLOWED_WRITERS)} known security-channel writer(s)')
          EOF

      - name: Record the PostgreSQL version gap
        run: |
          echo "CI PostgreSQL : ${{ steps.pg.outputs.server_version }}"
          echo "Project target: 18.x"
          echo "Known, intentional gap. A dedicated PG18 compatibility gate lands"
          echo "before database-sensitive product work at M9."

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate the OpenAPI document
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.draft.yaml

      - name: Every route must exist in the contract
        run: |
          set -euo pipefail
          # Driven by the real route table, not by reading route files.
          #
          # The file-scanning version could only see routes this repository
          # writes down, so it was blind to every route the framework or a
          # package registers. It missed three: Laravel's `/up` health route,
          # which served HTML from a JSON-only service, and the GET and PUT
          # `storage/{path}` pair that `filesystems.local.serve` turns on. An
          # undocumented endpoint is invisible to the only mechanism keeping the
          # two repositories in step, and one nobody declared is worse.
          php artisan route:list --json > /tmp/routes.json
          python3 - <<'EOF'
          import json, re, sys

          spec = open('docs/api/openapi.draft.yaml', encoding='utf-8').read()
          routes = json.load(open('/tmp/routes.json', encoding='utf-8'))

          missing = []
          for route in routes:
              uri = '/' + route['uri'].lstrip('/')
              # The contract is written without the /api/v1 mount prefix.
              path = re.sub(r'^/api/v1', '', uri) or '/'

              # The path, and then the methods under it.
              #
              # This used to look up the path alone and print the method only in
              # the error text, so adding DELETE to a path the contract
              # documents as GET passed silently — the two repositories could
              # drift by a whole verb without the gate noticing.
              block = re.search(
                  r'^\s{2}' + re.escape(path) + r':\s*$\n((?:\s{4}.*\n|\s*\n)*)',
                  spec, re.M,
              )

              if block is None:
                  missing.append(f"{route['method']} {uri} (path absent)")
                  continue

              documented = {
                  verb.lower()
                  for verb in re.findall(r'^\s{4}(get|put|post|patch|delete|head|options):', block.group(1), re.M | re.I)
              }

              for verb in route['method'].split('|'):
                  if verb.lower() in ('head', 'options'):
                      continue

                  if verb.lower() not in documented:
                      missing.append(f"{verb} {uri} (path documented, method not)")

          if missing:
              print('ERROR: routes not present in openapi.draft.yaml:')
              for entry in missing:
                  print('  ', entry)
              sys.exit(1)

          print(f'all {len(routes)} registered route(s) present in the contract')
          EOF

      - name: The error envelope holds on the live application
        run: |
          set -euo pipefail
          # The gate below lints the contract document. This one asks the
          # running application, because the two can disagree — and did.
          #
          # The renderer was scoped to `api/*`, so every other path on the host
          # fell through to Laravel's default handler and answered with
          # `{"exception", "file", "line", "trace"}`: a stack trace and absolute
          # filesystem paths. A document gate cannot see that, because the paths
          # it happens on are not in the document.
          php artisan serve --host=127.0.0.1 --port=8411 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8411/api/v1/health >/dev/null 2>&1 && break
            sleep 0.25
          done

          failed=0
          for path in /does-not-exist /up /storage/anything /admin /api/v1/does-not-exist /api/v1/auth/me; do
            for accept in 'application/json' 'text/html' '*/*'; do
              body=$(curl -s -H "Accept: $accept" "http://127.0.0.1:8411$path")
              ctype=$(curl -s -o /dev/null -w '%{content_type}' -H "Accept: $accept" "http://127.0.0.1:8411$path")

              case "$ctype" in
                application/problem+json*) ;;
                *) echo "ERROR: $path (Accept: $accept) answered $ctype, not application/problem+json"; failed=1 ;;
              esac

              if printf '%s' "$body" | grep -qE '"(exception|file|line|trace)"'; then
                echo "ERROR: $path (Accept: $accept) leaked framework internals"
                failed=1
              fi
            done
          done

          [ "$failed" -eq 0 ] || exit 1
          echo 'every path on the host answers with one envelope and no internals'

      - name: One error envelope, no exceptions
        run: |
          set -euo pipefail
          # API-1: RFC 9457 for every error. A second envelope shape is how a
          # client ends up needing per-endpoint parsing, which is the thing the
          # decision exists to prevent.
          python3 - <<'EOF'
          import re, sys

          spec = open('docs/api/openapi.draft.yaml', encoding='utf-8').read()

          # Every declared 4xx/5xx response body must be problem+json, with one
          # stated exception: the readiness probe's 503 carries a HealthReport,
          # the same schema as its 200. That is deliberate — a monitor branches
          # on `status`, and a body that changed shape when the service degraded
          # would be a body the monitor could not parse at the moment it matters.
          # It is a status report in a degraded state, not an error description.
          EXEMPT = {'HealthReport'}

          problems = []
          for match in re.finditer(r"^(\s+)'([45]\d\d)':\n((?:\1 .*\n|\s*\n)*)", spec, re.M):
              block = match.group(3)
              if '$ref:' in block and 'components/responses' in block:
                  continue            # a shared response, itself problem+json
              if any(name in block for name in EXEMPT):
                  continue
              if 'application/json' in block and 'application/problem+json' not in block:
                  problems.append(f"{match.group(2)} at line {spec[:match.start()].count(chr(10)) + 1}")

          if problems:
              print('ERROR: error responses not served as application/problem+json:')
              for entry in problems:
                  print('  ', entry)
              sys.exit(1)

          if 'ErrorResponse' in spec:
              print('ERROR: the superseded ErrorResponse envelope is still referenced.')
              sys.exit(1)

          print('every declared error response uses application/problem+json')
          EOF

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify documentation structure
        run: |
          set -euo pipefail
          for d in docs/architecture docs/api docs/security docs/testing docs/decisions; do
            test -d "$d" || { echo "missing required directory: $d"; exit 1; }
          done
          test -f docs/README.md
          test -f docs/api/openapi.draft.yaml
          test -f docs/api/api-conventions.md
          test -f docs/security/threat-model.md
          echo "documentation structure OK"

      - name: Verify no environment files other than .env.example are tracked
        run: |
          set -euo pipefail
          offenders=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: environment files are tracked:"
            echo "$offenders"
            exit 1
          fi
          echo "no environment files tracked"

      - name: Verify no dependency or build output is tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '^(vendor|node_modules|public/build)/'; then
            echo "ERROR: dependency or build output is tracked by git"
            exit 1
          fi
          echo "no dependency or build output tracked"

      - name: Check open questions carry reference ids
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, re, sys
          # A reference is a register id, an ADR, or a conflict-register number.
          ONE = (r'(?:(?:API|AUTH|2FA|ANTI|CACHE|DM|BA|OB|QJ|RL|GR|AD|PR|CH|SEC'
                 r'|SI|AU|LB|LO|LR|OPS|ARCH|PWA|RNG|DO|SP|TU|CR|AC|AA|ASSET)-\d+'
                 r'|ADR-\d{4}|#\d+)')
          REF = ONE + r'(?:\s*/\s*' + ONE + r')*'
          # A resolved question is kept for traceability with its id struck
          # through. That is a reference, not a missing one.
          REF = r'(?:~~)?' + REF + r'(?:~~)?'
          bad = []
          for dp, _, fn in os.walk('docs'):
              for f in fn:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(dp, f)
                  lines = open(path, encoding='utf-8').read().split('\n')
                  inside = False
                  for i, line in enumerate(lines, 1):
                      if line.startswith('#'):
                          inside = 'Open question' in line
                          continue
                      if not inside or not line.startswith('|'):
                          continue
                      cell = line.split('|')[1].strip().strip('*')
                      if cell in ('Ref', '---') or set(cell) <= {'-', ' '}:
                          continue
                      if not re.fullmatch(REF, cell):
                          bad.append(f'{path}:{i}: "{cell}"')
          if bad:
              print('ERROR: open-question rows without a reference id:')
              for b in bad:
                  print('  ', b)
              sys.exit(1)
          print('all open questions carry reference ids')
          EOF

      - name: Verify no Docker files were introduced
        run: |
          set -euo pipefail
          # Docker is deliberately not part of this project's workflow.
          if git ls-files | grep -Eiq '(^|/)(Dockerfile|compose\.ya?ml|docker-compose\.ya?ml)$'; then
            echo "ERROR: Docker files are tracked; this project does not use Docker."
            git ls-files | grep -Ei '(^|/)(Dockerfile|compose\.ya?ml|docker-compose\.ya?ml)$'
            exit 1
          fi
          echo "no Docker files tracked"
