openapi: 3.1.0

info:
  title: Purrenade API
  version: 0.1.0-draft
  summary: Contract shape for the Purrenade backend.
  description: |
    **Part contract, part record.** Twenty-one operations are implemented and
    live; the rest are the intended shape of endpoints that do not exist yet.
    Every operation says which it is, and a CI gate fails the build if a
    registered route is missing from this document.

    Implemented: the root and readiness routes, and the whole authentication and
    access surface. Not yet implemented: run lifecycle and progression (M9,
    blocked on ADR-0006), leaderboards (M10), achievements and characters (M11),
    profile beyond the display name, account deletion (SEC-3), and the admin
    capabilities (M13). This document is not generated from code.

    Authoritative product behavior lives in the frontend repository's
    Product/Game Specification (`purrenade/docs/product/`). Conventions for
    versioning, errors, pagination, idempotency and rate limiting are in
    `docs/api/api-conventions.md`.

    **Decided in M0.5:**

    - **ADR-0005 — Accepted.** A Nuxt BFF with server-managed session cookies for the
      browser, over a **token-capable** API. No endpoint may assume a browser, a cookie,
      or a same-site context: a future native client authenticates directly against this
      API with a bearer flow, bypassing the BFF.
    - **Achievement progression authority — APPROVED.** Client-reported summary counters
      alone are insufficient. Telemetry fields in `FinishRunRequest` are **inputs to
      server-side derivation, never authoritative totals**. Each achievement carries a
      **Verification Source** and a **Progress Persistence**; storing a cumulative total
      never reclassifies where its evidence came from.
    - **Audio Option C — APPROVED.** Settings owns music and SFX volume sliders; Pause
      exposes quick mute/unmute. Mute is stored independently of volume.
    - **Character unlock semantics — APPROVED.** Sero counts *actual* Loli activations,
      not thresholds earned.
    - **Leaderboard core rules — APPROVED**, including the Europe/Istanbul weekly boundary.
    - **Loli Bonus queueing is run-scoped.** There is deliberately **no owed/queued Loli
      field** in `Progression`.

    **Still open:**

    - **ADR-0006** — run validation / anti-cheat boundary. Whether a run is server-started,
      whether the seed is server-issued, and *what form* validated telemetry retention
      takes are open — but that *some* retention exists is now required.

    Decision status is marked inline as APPROVED, PROPOSED, or OPEN.
  contact:
    name: Purrenade
    url: https://example.invalid/purrenade
  license:
    name: Not yet determined — all rights reserved
    url: https://example.invalid/purrenade/license

servers:
  - url: https://api.purrenade.invalid/api/v1
    description: Placeholder. Real environments are defined at M1.

tags:
  - name: Auth
    description: Registration, login, email verification, password reset, 2FA, sessions.
  - name: Game Runs
    description: Run lifecycle and server-authoritative results.
  - name: Progression
    description: Paw counters, tutorial state, and derived progress.
  - name: Leaderboards
    description: Weekly and all-time rankings.
  - name: Achievements
    description: Achievement catalogue and player progress.
  - name: Characters
    description: Character catalogue and unlock state.
  - name: Profile
    description: Player profile and settings.
  - name: Admin
    description: Administrative surface. Capabilities are OPEN (SI-1).
  - name: Operational
    description: Infrastructure endpoints. Not product surface.

# One scheme, because there is one credential. Implemented at M2: this API is
# token-authenticated and stateless, and accepts no cookie at all (Sanctum's
# stateful-domain list is empty, deliberately — see config/sanctum.php).
#
# The browser's session cookie is a **BFF** concern and is not described here: it
# never reaches this service. The browser-facing contract is documented separately
# in the frontend repository, so the two layers stay distinguishable.
security:
  - sessionToken: []

paths:
  /:
    # The web root sits ABOVE this document's server base, which ends in
    # /api/v1. An OpenAPI 3.1 path-item-level `servers` entry re-bases just this
    # path, so the one endpoint outside the versioned prefix can be described
    # without weakening the base URL for the other twenty-something.
    servers:
      - url: https://api.purrenade.invalid
        description: Placeholder origin. Real environments are defined at M1.
    get:
      tags: [Operational]
      operationId: root
      summary: API-only signpost
      description: |
        **IMPLEMENTED (M1).** The web root of an API-only service.

        There is no browser-facing surface: no HTML, no Blade, no login page. Without this
        route the root returns a bare framework 404, which tells an operator nothing and
        reads like a misconfigured deployment.

        `success` is `false` — the caller asked for something this service does not serve —
        but the status is **200**, because the route is not an error: it answers exactly as
        designed. 404-ing a deliberate signpost only hides it from monitoring.

        Every field is a constant or a safe descriptor. No versions, no hostnames, no
        filesystem paths, no configuration, no stack data. See
        `docs/architecture/observability.md` §7.

        This is an operational endpoint, not product surface. It is documented here because
        every endpoint that exists must exist in this contract.
      security: []
      responses:
        '200':
          description: The service identifies itself and points at the API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [false]
                    description: Always false — the web root serves no resource.
                  message:
                    type: string
                    description: Fixed human-readable explanation.
                  service:
                    type: string
                    description: Service name, e.g. "Purrenade API".
                  environment:
                    type: string
                    description: Deployment tier name only, e.g. "local", "production".
                  api_base:
                    type: string
                    description: Path prefix every product endpoint lives under.
                  health:
                    type: string
                    description: Path of the readiness probe.
                  documentation:
                    type: [string, 'null']
                    format: uri
                    description: |
                      Public documentation URL, or `null` while none is published. It is
                      deliberately null rather than a plausible link that would 404.
                required: [success, message, service, environment, api_base, health, documentation]
              example:
                success: false
                message: This is an API-only application. No web access allowed.
                service: Purrenade API
                environment: production
                api_base: /api/v1
                health: /api/v1/health
                documentation: null
        '429': { $ref: '#/components/responses/RateLimited' }

  /health:
    get:
      tags: [Operational]
      operationId: health
      summary: Readiness probe
      description: |
        **IMPLEMENTED (M1).** Reports whether the service can actually do its job.

        **This is readiness, not liveness.** Every meaningful response this API produces
        comes out of PostgreSQL, so a process that cannot reach PostgreSQL is not ready to
        serve, and reporting `200` in that state is worse than reporting nothing. When the
        database is unreachable the endpoint answers **503**, which is what lets a load
        balancer take the instance out of rotation instead of paging a human.

        **Scope is exactly one dependency.** Cache, queue, mail and Redis are not adopted by
        this project; probing things the service does not use turns a health check into an
        observability system. See `docs/architecture/observability.md` §7.

        **No version field.** There is no source of truth for one — `composer.json` declares
        no version and the project has no releases. The only number available would be the
        framework's, which is not this service's version and which §7 forbids disclosing to
        unauthenticated callers. It will be added, here and in the response, when releases
        begin.

        Nothing in the payload is privileged: no hostnames, no filesystem paths, no
        credentials, no SQL, no stack traces. A failing dependency is logged in full
        server-side and reported here as nothing more than `"error"`.

        This is an operational endpoint, not product surface. It is documented here because
        every endpoint that exists must exist in this contract.
      security: []
      responses:
        '200':
          description: Ready. The process is up and the database is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
              example:
                success: true
                status: ok
                service: Purrenade API
                environment: production
                timestamp: '2026-01-15T09:24:11+00:00'
                checks:
                  application: ok
                  database: ok
        '503':
          description: |
            Not ready. The process is serving, but a dependency it needs is unreachable.
            The reason is in the service log, never in this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
              example:
                success: false
                status: degraded
                service: Purrenade API
                environment: production
                timestamp: '2026-01-15T09:24:11+00:00'
                checks:
                  application: ok
                  database: error
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new player
      description: |
        **IMPLEMENTED (M2).** Creates an unverified account, issues a session, and sends a
        six-digit verification code.

        A session is issued **before** verification because the product routes a new player
        straight to the code-entry screen (v0.3 boards 02 → 04), and that screen has to be
        able to call `resend`. The session is narrow: until the code is entered, the
        verified-email gate confines it to `GET /auth/me`, this flow's two endpoints, and
        `POST /auth/logout`.

        **Enumeration:** registration inherently reveals that an address is taken. Mitigated
        by rate limiting and a generic field error rather than a distinguishing message.

        **Side effect:** a queued verification mail, dispatched after commit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: The account was created and a session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
                  status: { type: string, enum: [authenticated] }
                  meta:
                    type: object
                    properties:
                      token:
                        type: string
                        description: |
                          The session credential. Issued to the **caller** — the BFF for
                          browser traffic — and never relayed to browser JavaScript.
                      email_verification: { $ref: '#/components/schemas/EmailVerificationState' }
                    required: [token]
                required: [status, data, meta]
        '409':
          description: |
            The address or display name was claimed between validation and commit. The
            unique indexes are the guarantee; validation is the courtesy.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        **IMPLEMENTED (M2).** The first factor. Ends in one of two states, and `meta.status`
        says which:

        - `authenticated` — a session token is issued.
        - `two_factor_required` — a short-lived challenge token is issued instead, and no
          session exists yet. A correct password alone never produces a credential.

        Both are `200`: the password was correct in both cases, and a discriminated status
        is easier to branch on than a status code meaning "correct, but not finished".

        **Enumeration resistance, two rules.** An unknown address and a wrong password
        return an identical `invalid_credentials` problem — field for field. And an unknown
        address still costs a password-hash comparison, so response timing does not
        distinguish the two either.

        An **unverified** account may sign in; it is routed to verification by the gate
        rather than refused at the door, because refusing here would reveal which addresses
        are registered but unconfirmed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: The password was accepted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticatedResult'
                  - $ref: '#/components/schemas/TwoFactorRequiredResult'
                discriminator:
                  propertyName: status
                  mapping:
                    authenticated: '#/components/schemas/AuthenticatedResult'
                    two_factor_required: '#/components/schemas/TwoFactorRequiredResult'
        '401':
          description: |
            `invalid_credentials`. One code for every failure — see the description.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/challenge:
    post:
      tags: [Auth]
      operationId: completeTwoFactorChallenge
      summary: Complete the two-factor challenge
      description: |
        **IMPLEMENTED (M2).** The second factor. Accepts either a TOTP code or a
        single-use recovery code, and consumes the challenge on success.

        **The only endpoint that mints a session carrying the `two-factor` ability**, which
        every admin-scoped route requires. There is deliberately no endpoint that adds that
        ability to an existing token, so a session either passed a challenge when it was
        created or never will.

        `challenge_token` comes from `POST /auth/login`. For browser traffic the BFF holds
        it server-side and the browser never receives it — a challenge token in a page is
        one script-injection defect away from undoing the second factor.

        A wrong TOTP code and a wrong recovery code return the **same** code: which kind of
        secret was guessed wrongly is not information the caller needs. Attempts are charged
        to the challenge and capped; exhausting the cap destroys it.

        **Replay is refused.** A TOTP code already accepted within its time step is
        rejected, per account, durably.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorChallengeRequest' }
      responses:
        '200':
          description: The second factor was accepted and a session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
                  status: { type: string, enum: [authenticated] }
                  meta:
                    type: object
                    properties:
                      token: { type: string }
                      used_recovery_code:
                        type: boolean
                        description: |
                          True when a recovery code was spent. Worth surfacing: it means
                          the player has one fewer, and it is logged server-side as a
                          notable event.
                      recovery_codes_remaining: { type: integer, minimum: 0 }
                    required: [token, used_recovery_code, recovery_codes_remaining]
                required: [status, data, meta]
        '401':
          description: |
            `two_factor_challenge_invalid` — unknown, expired, or attempt-exhausted. One
            code for all three, so a caller holding a guessed token learns nothing about
            whether it ever existed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `two_factor_not_enabled` — 2FA was turned off between login and this request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `two_factor_code_invalid` for a wrong code, or `validation_failed` for a
            malformed request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End this session
      description: |
        **IMPLEMENTED (M2).** Deletes the token row, so the credential stops existing —
        revocation is real, not a cookie being forgotten.

        This session only. Other devices are untouched; `DELETE /auth/sessions` is the
        endpoint for that intent.

        Reachable with an unverified account: a player must always be able to leave.
      responses:
        '204':
          description: The session has ended.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: The authenticated account's own state
      description: |
        **IMPLEMENTED (M2).** How a client restores state after a page refresh: the browser
        holds only an opaque BFF cookie, so on every fresh load the BFF asks this endpoint
        who the session belongs to.

        Reports **facts, not conclusions** — "email is verified", "2FA is enabled", "this
        session passed a challenge" — and the client derives its own state from them.

        One of exactly four endpoints an **unverified** account may reach: a player who
        cannot ask "am I verified?" cannot be told to verify.
      responses:
        '200':
          description: The caller's own account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
                  meta:
                    type: object
                    description: |
                      Present only while the address is unverified. A verified account has
                      no use for a resend countdown, and sending one would invite a stale
                      timer.
                    properties:
                      email_verification: { $ref: '#/components/schemas/EmailVerificationState' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify the email address with a six-digit code
      description: |
        **IMPLEMENTED (M2).** A six-digit code, not a magic link (v0.3 board 04).

        Six digits is a keyspace of one million, so the security of this flow is entirely
        in the surrounding rules: a **10-minute TTL**, a **5-attempt cap** per code after
        which the code is destroyed, a **42-second resend cooldown**, and rate limits on
        both submission and resend.

        Codes are **hashed at rest** with the application's slow hasher — a fast digest of
        six digits is reversible by exhaustive search — and are **single use**, consumed on
        success.

        Authenticated, which removes the enumeration surface entirely: there is no address
        parameter to probe, and a code is looked up by the caller's own id, so a code issued
        for one account cannot verify another regardless of who holds it.
      responses:
        '200':
          description: The address is verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            `verification_code_invalid`, `verification_code_expired`,
            `verification_code_missing`, or `validation_failed` for a malformed code.
            A malformed code spends no attempt — it is not a guess.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  description: |
                    Exactly six digits, as a **string**. `000042` is a valid code; treating
                    it as an integer would silently make it `42`.
              required: [code]

  /auth/email/verify/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Send a new verification code
      description: |
        **IMPLEMENTED (M2).** Issuing a new code **invalidates the previous one**, so the
        older mail stops working the instant this succeeds. Without that, every resend would
        widen an attacker's window rather than refreshing it.

        The cooldown returns **`429` with `retry_after`**, not a generic error, because the
        design renders a live countdown (v0.3 board 04 shows `0:42`) and can only do that if
        the server says how long is left.

        The strictest limits in the product: an unlimited endpoint that mails a
        caller-supplied address is a spam relay.
      responses:
        '200':
          description: A new code is on its way.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      email_verification: { $ref: '#/components/schemas/EmailVerificationState' }
                    required: [email_verification]
                required: [meta]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: |
            `verification_resend_cooldown` while the 42 seconds have not elapsed, or
            `rate_limited` when the hourly allowance is spent. Both carry `retry_after`.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password-reset link
      description: |
        **IMPLEMENTED (M2).** A link, deliberately unlike verification's code (v0.3 board
        06), so a player cannot confuse one flow for the other.

        **The response is identical whether or not the address exists** — unknown address,
        known address, even a mail-send failure all return the same `202` body. Anything
        that distinguishes them makes this an account-existence oracle that needs no
        credentials to query, and the design's own copy depends on the server actually
        behaving this way.

        The link points at the **frontend**, not at this API.

        Tokens are hashed at rest, single use, and time-limited; the broker verifies the
        token and the address as a pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 255 }
              required: [email]
      responses:
        '202':
          description: |
            Accepted. Says nothing about whether the address is registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [accepted] }
                  meta:
                    type: object
                    properties:
                      detail: { type: string }
                required: [status, meta]
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      description: |
        **IMPLEMENTED (M2).** Completes the reset and **revokes every session**, including
        any the caller holds: a reset normally answers a suspected compromise, so the point
        is to evict whoever else is signed in — which has to include sessions this request
        cannot identify.

        Applies the **same password policy as registration**. A reset path that accepted a
        weaker password is how a policy quietly becomes advisory.

        ### The invariant — APPROVED, regression gate S8

        **A completed reset never touches two-factor authentication.** Not the enrolment
        flag, not the TOTP secret, not one recovery code, and it marks no challenge as
        satisfied. The next login is **still challenged**.

        Email already controls password reset. If a reset also cleared 2FA, compromising a
        mailbox would compromise the entire account in one step and the second factor would
        defend against precisely the attack it exists to stop. A player who has lost their
        authenticator uses recovery codes, which is a separate process.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: The password was changed. Every session has been revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [password_reset] }
                  meta:
                    type: object
                    properties:
                      detail: { type: string }
                required: [status, meta]
        '422':
          description: |
            `reset_token_invalid` for an unknown address, a wrong token **or** an expired
            one — one code for all three, so a caller holding a guessed token cannot learn
            whether the address exists. `validation_failed` for a policy violation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password:
    put:
      tags: [Auth]
      operationId: updatePassword
      summary: Change the password from inside a session
      description: |
        **IMPLEMENTED (M2).** Requires `current_password`: an open session is not proof that
        the account's owner is at the keyboard, which is exactly the borrowed-laptop and
        stolen-session case this guards.

        Ends every **other** session and keeps this one. A deliberate change by someone who
        can already prove the old password is not the same event as a reset, and signing the
        player out of the screen they just used would be friction with no security value.

        Two-factor state is untouched, for the same reason as in the reset flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePasswordRequest' }
      responses:
        '204':
          description: The password was changed and other sessions ended.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa:
    get:
      tags: [Auth]
      operationId: getTwoFactorState
      summary: Two-factor state for this account
      description: |
        **IMPLEMENTED (M2).** State, never secrets: whether 2FA is on, whether an enrolment
        is half-finished, how many recovery codes remain, and whether the role makes it
        mandatory. The TOTP secret is never returned here.

        `recovery_codes_remaining` lets the UI warn a player who has nearly exhausted them
        — the state in which losing an authenticator stops being recoverable.
      responses:
        '200':
          description: Current two-factor state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TwoFactorState' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/2fa/enable:
    post:
      tags: [Auth]
      operationId: beginTwoFactorEnrolment
      summary: Begin two-factor enrolment
      description: |
        **IMPLEMENTED (M2).** Generates a secret and returns the data needed to display it.

        **2FA is not active after this call.** The secret is stored, but enrolment completes
        only when `POST /auth/2fa/confirm` proves the player can produce a code from it.
        Enabling 2FA in one step against a secret the player never successfully scanned
        locks them out of their own account, with no self-service way back.

        Requires `current_password`: this begins a change to the account's defences.

        Calling it again before confirming **replaces** the secret and discards any recovery
        codes from a previous enrolment — an old printout must not bypass a new second
        factor.

        The provisioning data is returned three ways because a player on the same device as
        their authenticator cannot scan their own screen, and one on a locked-down phone may
        have to type the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '200':
          description: Enrolment started. 2FA is still off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TwoFactorEnrolment' }
                  status: { type: string, enum: [two_factor_pending] }
                  meta:
                    type: object
                    properties:
                      detail: { type: string }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/confirm:
    post:
      tags: [Auth]
      operationId: confirmTwoFactorEnrolment
      summary: Prove possession and switch two-factor on
      description: |
        **IMPLEMENTED (M2).** Verifies a live code against the pending secret, activates
        2FA, and issues recovery codes.

        **The recovery codes in this response are the only time they are ever
        transmitted.** They are stored hashed and there is no endpoint that can show them
        again. A player who misses them regenerates — which invalidates the set they lost,
        as it should.

        No `current_password`: the caller already re-authenticated to *start* enrolment, and
        this step is itself a possession proof. Asking again would add friction to the one
        screen where the player is already juggling two devices.

        This does **not** upgrade the current session to one that passed a challenge.
        Enabling 2FA is not the same event as proving it at sign-in, and admin access
        depends on the difference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^\d{6}$' }
              required: [code]
      responses:
        '200':
          description: Two-factor authentication is now enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
                  status: { type: string, enum: [two_factor_enabled] }
                  meta:
                    type: object
                    properties:
                      recovery_codes:
                        type: array
                        items: { type: string }
                        description: Shown exactly once. Never retrievable again.
                      detail: { type: string }
                    required: [recovery_codes]
                required: [status, data, meta]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`two_factor_code_invalid`, or `validation_failed`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/recovery-codes:
    post:
      tags: [Auth]
      operationId: regenerateRecoveryCodes
      summary: Issue a new set of recovery codes
      description: |
        **IMPLEMENTED (M2).** The previous set stops working immediately. A player asking
        for new codes is saying the old list is lost or exposed; leaving it valid would
        answer a security action by doubling the number of live bypasses.

        Requires `current_password`. Codes are returned once, in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '200':
          description: A new set, replacing the previous one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [recovery_codes_regenerated] }
                  meta:
                    type: object
                    properties:
                      recovery_codes:
                        type: array
                        items: { type: string }
                      detail: { type: string }
                    required: [recovery_codes]
                required: [status, meta]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/disable:
    post:
      tags: [Auth]
      operationId: disableTwoFactor
      summary: Turn two-factor authentication off
      description: |
        **IMPLEMENTED (M2).** Clears the secret and every recovery code. Requires
        `current_password`.

        **Refused for administrators** with `admin_two_factor_mandatory` (403). 2FA is
        mandatory for that role and an admin cannot opt out — the refusal lives in the
        service as well as at the endpoint, so the destructive path cannot be reached
        without passing it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '204':
          description: Two-factor authentication is off.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            `admin_two_factor_mandatory` for an administrator, or `email_not_verified`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List this account's active sessions
      description: |
        **IMPLEMENTED (M2).** One row per signed-in device (v0.3 board 20), newest first,
        with the caller's own session flagged so the UI can label it and avoid presenting
        "sign out" as though it referred to somewhere else.

        Ordered by a **total order**, so the list does not reshuffle between reads of the
        same data.

        **Three deliberate omissions.** The token itself, obviously — but also the database
        id, replaced by an unguessable `id` so a client can only name sessions it was shown;
        and **IP address and derived location**, which are not recorded at all. v0.3 shows an
        approximate location; that needs a geo-IP source and a retention policy decided
        together (**AUTH-4, OPEN**), and storing the address "for later" would create the
        personal-data obligation before the decision.
      responses:
        '200':
          description: The caller's sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Auth]
      operationId: revokeOtherSessions
      summary: Sign out every other device
      description: |
        **IMPLEMENTED (M2).** Revokes all sessions **except** the caller's own.

        **Resolves AUTH-2.** The action a player is taking is "get everyone else out", and
        `POST /auth/logout` already exists for the other intent; ending the caller's own
        session here would make every use of this control end at the login screen.

        Requires `current_password`, because it evicts sessions the caller cannot see.

        Scoped to the caller's own account in the query itself — an ownership check written
        as a separate step is a step somebody can forget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '200':
          description: Other sessions ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [sessions_revoked] }
                  meta:
                    type: object
                    properties:
                      revoked_count: { type: integer, minimum: 0 }
                    required: [revoked_count]
                required: [status, meta]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions/{session}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke one session
      description: |
        **IMPLEMENTED (M2).** Deletes the token row, so the credential stops existing.

        **`404`, not `403`, for a session that is not the caller's.** A `403` would confirm
        that the session exists and belongs to somebody, which makes this an existence
        oracle over a table of session identifiers. `docs/security/authorization-and-roles.md`
        §6 draws that line explicitly, and this is the case it draws it for.

        Revoking one's own session is permitted — it is simply a sign-out.
      parameters:
        - name: session
          in: path
          required: true
          description: |
            The session's opaque `id` from `GET /auth/sessions`, never a database key.
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The session has been revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /game-runs:
    post:
      tags: [Game Runs]
      operationId: startGameRun
      summary: Start a run
      description: |
        **OPEN (ADR-0006).** Whether runs are started server-side at all depends
        on the validation model and on whether runs are playable offline (PWA-1).

        If adopted, this issues a run token, a server-controlled RNG seed, and a
        server-recorded start time, which bounds run duration and spawn sequence
        against server-observed reality.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '201':
          description: Run started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartedRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /game-runs/{runId}/finish:
    post:
      tags: [Game Runs]
      operationId: finishGameRun
      summary: Submit a run result
      description: |
        APPROVED in principle; validation model OPEN (ADR-0006).

        **Idempotent.** Requires an `Idempotency-Key`; a repeat with the same key
        returns the original response and performs no further work.

        The client **proposes**; the server **decides**. The response carries the
        authoritative score and the resulting progression, and the client
        displays those values rather than its own.

        Accepted runs update the run record, the paw ledger, achievement progress
        and character unlocks **in one transaction**.
      parameters:
        - name: runId
          in: path
          required: true
          description: The run being finished.
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key, unique per player per endpoint.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishRunRequest' }
      responses:
        '200':
          description: Run result recorded. The returned values are authoritative.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '409':
          description: The same idempotency key was used with a different request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /progression:
    get:
      tags: [Progression]
      operationId: getProgression
      summary: Get the player's progression
      description: |
        APPROVED. Returns the three distinct paw counters and derived progress.
        There is no generic `paws` field.
      responses:
        '200':
          description: Current progression.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progression' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /progression/tutorial:
    post:
      tags: [Progression]
      operationId: completeTutorial
      summary: Record tutorial completion
      description: |
        APPROVED. Completion is persisted to the player profile so it survives
        reinstall. Replaying the tutorial from Settings does not clear or
        re-stamp it. The tutorial affects no score, leaderboard, or progression
        data.
      responses:
        '200':
          description: Tutorial completion recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TutorialState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /leaderboards:
    get:
      tags: [Leaderboards]
      operationId: getLeaderboard
      summary: Get a leaderboard page
      description: |
        APPROVED (v0.3 board 15). Two windows: weekly and all-time. Ranks by best
        single-run score. The response always includes the requesting player's own
        row with its true rank, even when outside the page.

        **Weekly boundary — APPROVED:** Monday 00:00 Europe/Istanbul, attributed by
        server-recorded run start. Türkiye has been UTC+3 year-round since 2016, so there is
        no DST-ambiguous or duplicated hour at rollover.

        Ordering is a **total order** — score, then earlier achievement, then shorter
        duration, then a stable id — so cursor pagination cannot duplicate or skip rows.

        Banned players' entries are hidden but retained; deleted players must not appear
        under their former identity; opted-out players are excluded from public pages but
        still see their own rank.
      parameters:
        - name: window
          in: query
          required: true
          description: Which ranking window to read.
          schema:
            type: string
            enum: [weekly, all_time]
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: A page of the ranking, plus the player's own row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaderboardPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /achievements:
    get:
      tags: [Achievements]
      operationId: listAchievements
      summary: List achievements and the player's progress
      description: |
        APPROVED in shape (v0.3 board 16): a catalogue of 16 with progress,
        unlocked and locked states, and hidden rewards.

        **OPEN:** ten achievements are undefined (AU-1), and two of the six
        defined ones depend on Çay and Trileçe, which are not v1 mechanics (AU-2).
      responses:
        '200':
          description: Achievement catalogue with player progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: All achievements with this player's progress.
                    items: { $ref: '#/components/schemas/Achievement' }
                  unlocked_count: { type: integer, description: Number unlocked. }
                  total_count: { type: integer, description: Catalogue size. }
                required: [data, unlocked_count, total_count]
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /characters:
    get:
      tags: [Characters]
      operationId: listCharacters
      summary: List characters and unlock state
      description: |
        APPROVED in shape (v0.3 board 09). A character is selectable only when
        **both** gates are satisfied: the unlock criterion is met and approved
        artwork exists.

        **OPEN:** unlock criteria semantics (AU-4), and whether non-Ayşenur
        characters have their own special power (AU-5).
      responses:
        '200':
          description: Character catalogue with unlock state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: All characters with this player's unlock state.
                    items: { $ref: '#/components/schemas/Character' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Get the player's profile
      description: APPROVED (v0.3 board 17).
      responses:
        '200':
          description: The player's profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Update the player's display name
      description: |
        **PARTIALLY IMPLEMENTED (M2): display name only.**

        Locale, favourite character and audio/motion settings are not yet accepted. They
        belong with profile and settings work, and one of them is still undecided —
        **OPEN (#10):** whether audio settings are on/off toggles or volume levels, which
        v0.3 contradicts itself about between the pause and settings screens.

        Changing an email address is deliberately **not** part of this endpoint. It needs its
        own verification flow — a code to the new address, with the old one retained until
        that succeeds — which is a feature rather than a field.

        **Rate-limited two ways**, because the leaderboard shows this name to everyone and
        rapid churn is an impersonation and evasion tool rather than self-expression: a
        named limiter caps changes per day, and a timestamp on the account gives the client
        a concrete `retry_after`. The timestamp is what makes the cooldown real — a limiter
        bucket disappears when the cache does.

        Re-submitting the current name, including a change of casing only, is not a rename
        and does not spend the cooldown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 3
                  maxLength: 20
                  description: |
                    Same APPROVED rules as registration, and the same case-insensitive
                    uniqueness — compared on the application-normalised form.
              required: [display_name]
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `conflict` — the name was claimed between validation and commit. The unique
            index is the guarantee.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: |
            `display_name_change_cooldown` while the per-account cooldown is running, or
            `rate_limited` when the daily allowance is spent. Both carry `retry_after`.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /profile/delete:
    post:
      tags: [Profile]
      operationId: requestAccountDeletion
      summary: Request account deletion
      description: |
        **OPEN (SEC-3).** Required by KVKK/GDPR, and by both major app stores for
        any app that supports account creation. What deletion does to recorded
        runs and public leaderboard entries is undecided (LB-5, DM-4).
      responses:
        '202':
          description: Deletion requested.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/overview:
    get:
      tags: [Admin]
      operationId: adminOverview
      summary: Minimum administrative surface
      description: |
        **IMPLEMENTED (M2).** Exists to make the admin access-control decisions testable,
        and for nothing else. The approved capability set — user lookup, suspension, run
        inspection and invalidation, name moderation, audit inspection — is M13 work
        (**AD-5**); building any of it now would be scope with no authorization question
        left to answer.

        What it does prove, on every request, through the route group's middleware:

        1. the caller is an **administrator**;
        2. their address is **verified**;
        3. they have **enrolled** a second factor;
        4. **this session actually passed a two-factor challenge**.

        Four conditions, each refused with its own stable code, and four negative tests. The
        fourth is the one that is easy to get wrong: a token minted by a password-only login
        — from before enrolment, or by any path that skipped the challenge — is refused even
        though the account *has* 2FA. The ability is welded onto the credential when it is
        issued and no endpoint adds it later.

        Enforcement is on the route **group**, so a route added to the admin surface later
        inherits all four. `docs/security/authorization-and-roles.md` §5 requires exactly
        that: a per-route annotation is one forgotten line away from a privileged bypass.
      responses:
        '200':
          description: Aggregate state, visible to a fully authenticated administrator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminOverview' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            `admin_role_required` for a non-admin, `email_not_verified` for an unverified
            admin, or `admin_two_factor_required` when 2FA is not enrolled **or** this
            session never passed a challenge.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/players:
    get:
      tags: [Admin]
      operationId: adminListPlayers
      summary: Look up players
      description: |
        **OPEN (SI-1).** Admin capabilities are undefined in every reference.
        This path is a placeholder so the admin surface is visible in the
        contract; it is not implemented until specified.

        Requires the admin role **and** satisfied 2FA. Every admin action is
        audited.
      parameters:
        - name: query
          in: query
          required: false
          description: Free-text lookup.
          schema: { type: string }
      responses:
        '200':
          description: Matching players.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Matching players.
                    items: { $ref: '#/components/schemas/Profile' }
                required: [data]
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        **IMPLEMENTED (M2).** A Sanctum personal access token, presented as
        `Authorization: Bearer <token>`. One token is one signed-in device — the rows it
        addresses are what `/auth/sessions` lists and revokes.

        **Two callers, one scheme, and that is the point (ADR-0005):**

        - **Browser.** The token is issued to the **Nuxt BFF**, which keeps it in its own
          server-side session and attaches it upstream. It never reaches browser
          JavaScript, and no bearer token is stored in `localStorage` or `sessionStorage`.
          The browser's only credential is an `HttpOnly`, `Secure`, `SameSite=Lax` cookie
          set by the BFF, which this API never sees.

        - **Future native client.** Authenticates directly against these same endpoints
          with the same scheme, bypassing the BFF. Not implemented in v1; the obligation
          it places on this contract is that **no endpoint may assume a browser, a cookie,
          or a same-site context**.

        **Abilities record how the session was authenticated.** Every token carries
        `session`; only a token minted by `POST /auth/2fa/challenge` also carries
        `two-factor`, and no endpoint adds that ability to an existing token. Admin-scoped
        routes require it, which is how "this session passed a second factor" is
        distinguished from "this account has a second factor". Tokens are never issued
        with the `*` wildcard.

        **CSRF is not a concern on this hop.** The BFF is not a browser and attaches the
        credential explicitly, so no ambient authority exists here. CSRF is enforced at the
        BFF, where the cookie is.

        Laravel remains the authentication authority. The BFF carries credentials; it makes
        no authorization decision.

  responses:
    Unauthenticated:
      description: |
        No credential, or one that no longer resolves. `code`: `unauthenticated`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated but not permitted. The `code` says which gate refused:
        `forbidden`, `email_not_verified`, `admin_role_required`,
        `admin_two_factor_required`, or `admin_two_factor_mandatory`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found — **or** found and not visible to this caller. The two are deliberately
        indistinguishable, so the endpoint is not an existence oracle. `code`: `not_found`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        The request contradicts current state. `code`: `conflict`,
        `email_already_verified`, `two_factor_already_enabled`, `two_factor_not_enabled`,
        or `two_factor_not_pending`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: |
        The request failed validation. Carries `errors`, a map of field name to a list of
        `{code, message}` — branch on `code`, never on `message`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: |
        Too many requests. Carries `retry_after` in seconds **and** a `Retry-After`
        header. Honour it; never retry in a loop.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: |
        **The** error shape. RFC 9457 Problem Details, served as
        `application/problem+json`, for every error this API produces — validation,
        authentication, authorization, conflict, rate limiting, and unexpected failures
        alike (API-1).

        One shape means a client needs one parser. There is no second envelope anywhere in
        this contract.

        **Never present:** stack traces, SQL, internal class names, file paths, dependency
        versions. That holds in every environment, including with debug mode on — a
        response shape that changes between environments is one nobody can test against.
      properties:
        type:
          type: string
          format: uri
          description: |
            A URN identifying the problem type, always `urn:purrenade:error:{code}`.

            A URN rather than an `https://` URL: RFC 9457 does not require the type to be
            dereferenceable, and no published documentation site exists to dereference.
            Inventing a URL that returns 404 would be worse than being honest.
          examples: ['urn:purrenade:error:validation_failed']
        title:
          type: string
          description: |
            A short, stable, **English** summary of the problem *type*, not of this
            occurrence. Not localised — see `detail`.
        status:
          type: integer
          description: The HTTP status, repeated in the body as RFC 9457 specifies.
          examples: [422]
        detail:
          type: string
          description: |
            Human-readable explanation of **this occurrence**. For display and logs only.
            May be reworded or localised at any time, so **never branch on it**.
        instance:
          type: string
          description: The path that produced the problem.
          examples: ['/api/v1/auth/register']
        code:
          type: string
          description: |
            **The value clients branch on.** Stable, machine-readable, never localised.
            Always equal to the tail of `type`, so the two cannot disagree.

            Adding a code is additive and safe. Changing or removing one is breaking and
            requires a new API version.
          examples: ['validation_failed']
        correlation_id:
          type: string
          description: |
            Present on every problem, and echoed in the `X-Correlation-Id` response header.
            The player can quote it; it appears in this service's logs and in the BFF's.
        errors:
          type: object
          description: |
            Present on validation failures. Maps a field name to the list of things wrong
            with it, each with its own stable code — so a client can render "already taken"
            in Turkish without parsing an English sentence.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                code:
                  type: string
                  description: |
                    Stable per-field code, e.g. `required`, `taken`, `too_short`,
                    `too_long`, `email_invalid`, `confirmation_mismatch`,
                    `password_incorrect`, `password_compromised`, `format_invalid`.
                message:
                  type: string
                  description: Human-readable. For display only.
              required: [code, message]
        retry_after:
          type: integer
          minimum: 0
          description: |
            Present on `429`. Seconds to wait. Also sent as a `Retry-After` header — the
            header is what proxies and HTTP clients honour, the member is what a countdown
            in the UI needs.
      required: [type, title, status, detail, instance, code, correlation_id]
      examples:
        - type: urn:purrenade:error:validation_failed
          title: Validation failed
          status: 422
          detail: The given data was invalid.
          instance: /api/v1/auth/register
          code: validation_failed
          correlation_id: 01K5R8Q2M3N4P5Q6R7S8T9V0W1
          errors:
            email:
              - code: taken
                message: This email address is already registered.

    HealthReport:
      type: object
      description: |
        The readiness report. Identical in shape whether the service is ready or not — a
        monitor should branch on `status` and the HTTP code, never on which fields exist.

        There is deliberately no `version` field; see the endpoint description.
      properties:
        success:
          type: boolean
          description: True only when every check passed.
        status:
          type: string
          enum: [ok, degraded]
          description: '`ok` when every check passed, `degraded` when any did not.'
        service:
          type: string
          description: Service name, e.g. "Purrenade API".
        environment:
          type: string
          description: Deployment tier name only, e.g. "local", "production".
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 with a UTC offset, e.g. `2026-01-15T09:24:11+00:00`.
        checks:
          type: object
          description: |
            One entry per dependency actually relied upon. A failing check reports `error`
            and nothing else: the reason is logged server-side, because a driver message
            carries the host, port, database name and role.
          properties:
            application:
              type: string
              enum: [ok]
              description: |
                Always `ok` when this response is produced — it could not have been produced
                otherwise. Present so the report is readable without knowing that.
            database:
              type: string
              enum: [ok, error]
              description: Whether the default PostgreSQL connection answered.
          required: [application, database]
      required: [success, status, service, environment, timestamp, checks]

    AuthenticatedUser:
      type: object
      description: |
        What a caller is told about their **own** account.

        Reports facts rather than conclusions, so the client derives its state machine from
        them and the server does not send a state name the client then has to trust.

        Field-level authorization applies: the password hash, the TOTP secret, recovery
        codes and the remember token are all absent. Recovery codes appear only as a
        **count** — they are transmitted exactly once, when generated.
      properties:
        id: { type: integer }
        display_name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [player, admin] }
        email_verified: { type: boolean }
        email_verified_at: { type: [string, 'null'], format: date-time }
        two_factor_enabled:
          type: boolean
          description: |
            True only when a secret exists **and** possession has been confirmed. A
            half-finished enrolment is `two_factor_pending`, not this.
        two_factor_pending:
          type: boolean
          description: Enrolment started but never confirmed. 2FA is off.
        two_factor_recovery_codes_remaining:
          type: integer
          minimum: 0
          description: |
            A count, never the values. Lets the UI warn a player who has nearly exhausted
            them — the state in which losing an authenticator stops being recoverable.
        requires_two_factor_enrolment:
          type: boolean
          description: |
            True for an administrator who has not enrolled. A real, reachable state: an
            operator can promote a player who has no second factor. Reported so the UI can
            say what to do instead of showing an account that merely appears broken.
        created_at: { type: [string, 'null'], format: date-time }
        session:
          type: [object, 'null']
          description: The session this response was produced for.
          properties:
            id: { type: string, format: uuid }
            device: { type: string }
            two_factor_satisfied:
              type: boolean
              description: |
                Whether **this session** passed a two-factor challenge — a different
                question from whether the account has 2FA, and the one admin access
                depends on.
            created_at: { type: [string, 'null'], format: date-time }
          required: [id, device, two_factor_satisfied]
      required:
        - id
        - display_name
        - email
        - role
        - email_verified
        - two_factor_enabled
        - two_factor_pending
        - two_factor_recovery_codes_remaining
        - requires_two_factor_enrolment

    AuthenticatedResult:
      type: object
      description: A login that produced a session.
      properties:
        status:
          type: string
          enum: [authenticated]
          description: |
            **The discriminator.** Top-level rather than nested in `meta`, because it
            decides the response shape and a discriminator cannot read a property inside
            another object. Every envelope in this API that has a `status` puts it here,
            so the rule is one rule.
        data: { $ref: '#/components/schemas/AuthenticatedUser' }
        meta:
          type: object
          properties:
            token:
              type: string
              description: |
                The session credential. For browser traffic this is consumed by the BFF and
                held server-side; it never reaches browser JavaScript.
          required: [token]
      required: [status, data, meta]

    TwoFactorRequiredResult:
      type: object
      description: |
        The password was correct and a second factor is required. **No session exists yet.**
      properties:
        status:
          type: string
          enum: [two_factor_required]
        meta:
          type: object
          properties:
            challenge_token:
              type: string
              description: |
                Short-lived, single-purpose, and worth **nothing** on its own: it proves
                only that the first factor was satisfied. For browser traffic the BFF holds
                it server-side; the browser never receives it.
            challenge_expires_at: { type: string, format: date-time }
            recovery_codes_available:
              type: boolean
              description: |
                So the challenge screen offers the recovery-code path only when one is
                actually available.
          required: [challenge_token, challenge_expires_at, recovery_codes_available]
      required: [status, meta]

    RegisterRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 3
          maxLength: 20
          description: |
            **APPROVED rules.** 3–20 characters of Unicode letters and digits plus
            `_ . -`; at least one letter; no leading or trailing punctuation.
            **Case-insensitive unique**, compared on an application-normalised form (NFKC,
            case-folded, with the Turkish dotted capital I folded to `i` so `İstanbul` and
            `istanbul` cannot both exist).
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            **12–128 characters, no composition rules.** Length is what resists guessing;
            mandatory character classes mostly produce predictable passwords. Checked
            against a breach corpus via k-anonymity — the password itself never leaves the
            server.

            The maximum is a **validation error, never a silent trim**: a password quietly
            shortened to fit is one the player cannot reproduce. Hashing is argon2id, which
            has no length limit (bcrypt would truncate at 72 bytes).
        password_confirmation: { type: string }
      required: [display_name, email, password, password_confirmation]

    LoginRequest:
      type: object
      properties:
        email: { type: string, maxLength: 255 }
        password:
          type: string
          description: |
            Deliberately **not** length-validated here. A login form that rejects a short
            password before checking it discloses the policy and, worse, distinguishes
            malformed input from wrong credentials.
      required: [email, password]

    TwoFactorChallengeRequest:
      type: object
      description: |
        Exactly one of `code` or `recovery_code`.
      properties:
        challenge_token:
          type: string
          maxLength: 128
          description: From the `two_factor_required` login response.
        code:
          type: string
          pattern: '^\d{6}$'
          description: A current TOTP code from the player's authenticator app.
        recovery_code:
          type: string
          maxLength: 64
          description: |
            A single-use recovery code. Spending one is logged as a notable event: it means
            an authenticator was lost — or a stolen printout is being used.
      required: [challenge_token]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: From the emailed link. Single use and time-limited.
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 12, maxLength: 128 }
        password_confirmation: { type: string }
      required: [token, email, password, password_confirmation]

    UpdatePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          description: |
            Re-authentication. An open session is not proof that the account's owner is at
            the keyboard.
        password: { type: string, minLength: 12, maxLength: 128 }
        password_confirmation: { type: string }
      required: [current_password, password, password_confirmation]

    CurrentPasswordRequest:
      type: object
      description: |
        Re-authentication for a security-sensitive action that needs no other input.

        The password travels on the request itself rather than being "confirmed" once into
        a window, because this API has no session to remember a confirmation in — it is
        token-authenticated so a native client can use the same endpoints. Per-request
        re-authentication is also impossible to leave half-implemented: there is no window
        that might still be open from an earlier action.
      properties:
        current_password: { type: string }
      required: [current_password]

    EmailVerificationState:
      type: object
      properties:
        resend_available_in:
          type: integer
          minimum: 0
          description: |
            Seconds until a new code may be requested; `0` when it may be. The cooldown is
            **42 seconds**, which is the number v0.3 board 04 renders as `(0:42)`. Returned
            rather than assumed, so the client's countdown cannot drift from the server's
            refusal.
        expires_in:
          type: integer
          description: Seconds until the current code expires. 600 — a ten-minute TTL.
      required: [resend_available_in]

    TwoFactorState:
      type: object
      properties:
        enabled: { type: boolean }
        pending:
          type: boolean
          description: Enrolment started; possession not yet proven. 2FA is off.
        confirmed_at: { type: [string, 'null'], format: date-time }
        recovery_codes_remaining: { type: integer, minimum: 0 }
        mandatory:
          type: boolean
          description: True for the `admin` role, which cannot disable 2FA.
      required: [enabled, pending, recovery_codes_remaining, mandatory]

    TwoFactorEnrolment:
      type: object
      description: |
        Provisioning data for a **pending** enrolment. 2FA is not active until confirmed.
      properties:
        secret:
          type: string
          description: |
            The base32 secret, for manual entry. Returned because a player on the same
            device as their authenticator cannot scan their own screen.
        otpauth_uri:
          type: string
          description: '`otpauth://totp/…`, for an authenticator app to consume directly.'
        qr_code:
          type: string
          description: |
            The QR code as a `data:image/svg+xml;base64,…` URI, rendered server-side.

            A data URI for an `<img>` rather than raw SVG markup, deliberately: raw markup
            would have to be injected with `v-html`, keeping an XSS sink alive for one
            screen's convenience. An `<img>` cannot execute script.
      required: [secret, otpauth_uri, qr_code]

    Session:
      type: object
      description: One signed-in device (v0.3 board 20).
      properties:
        id:
          type: string
          format: uuid
          description: |
            Opaque and unguessable, never the database key. A client can only name sessions
            it was shown.
        device:
          type: string
          description: |
            A coarse label derived server-side, e.g. "Chrome on Android". Deliberately
            lossy: enough for a player to recognise their own devices and spot one they do
            not, without becoming a tracking identifier. The raw User-Agent is never stored.
        is_current: { type: boolean }
        two_factor_satisfied: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        last_active_at:
          type: [string, 'null']
          format: date-time
          description: Null when the session has not made a request since it was created.
      required: [id, device, is_current, two_factor_satisfied, created_at, last_active_at]

    AdminOverview:
      type: object
      description: |
        The minimum administrative surface. It exists to make the access-control decisions
        testable and for nothing else — the approved admin capability set is M13 work.

        Counts are aggregate and contain no personal data, so an endpoint that exists for a
        test does not become a data-exposure surface of its own.
      properties:
        administrator:
          type: object
          properties:
            id: { type: integer }
            display_name: { type: string }
          required: [id, display_name]
        accounts:
          type: object
          properties:
            total: { type: integer }
            verified: { type: integer }
            administrators: { type: integer }
            with_two_factor: { type: integer }
          required: [total, verified, administrators, with_two_factor]
        capabilities:
          type: object
          properties:
            available:
              type: array
              items: { type: string }
              description: |
                Empty in M2, so the frontend can render an honest "not built yet" rather
                than an empty console.
            planned_milestone: { type: string }
          required: [available, planned_milestone]
      required: [administrator, accounts, capabilities]

    Player:
      type: object
      description: Identity and account state.
      properties:
        id: { type: string, description: Stable identifier. }
        username: { type: string, description: Public display name. }
        email_verified: { type: boolean, description: Whether the address is verified. }
        two_factor_enabled: { type: boolean, description: Whether TOTP is active. }
        role: { type: string, enum: [player, admin], description: Authorization role. }
        locale: { $ref: '#/components/schemas/Locale' }
        created_at: { type: string, format: date-time, description: Account creation time. }
      required: [id, username, email_verified, two_factor_enabled, role, locale, created_at]

    Locale:
      type: string
      description: Player-facing language. Turkish is the source locale.
      enum: [tr, en, es]

    StartRunRequest:
      type: object
      description: Begin a run. Whether runs are server-started is OPEN (ADR-0006).
      properties:
        character_id: { type: string, description: Character the player selected. }
      required: [character_id]

    StartedRun:
      type: object
      description: |
        A server-started run. The seed is server-issued if that model is adopted
        (RNG-1), making the spawn sequence known to the server.
      properties:
        run_id: { type: string, description: Identifier for the run. }
        run_token: { type: string, description: Presented when finishing the run. }
        seed: { type: string, description: RNG seed. Presence depends on ADR-0006. }
        started_at: { type: string, format: date-time, description: Server-recorded start time. }
      required: [run_id, started_at]

    FinishRunRequest:
      type: object
      description: |
        The client's submission at the end of a run.

        **Everything the client sends is untrusted.** It is namespaced under `telemetry` and
        every field is prefixed `reported_`, so the boundary is visible in the schema itself
        rather than only in prose. The server MAY ignore these values entirely.

        The authoritative numbers are **not in this request**. They are computed server-side
        and returned in `RunResult.derived_facts`, where a client cannot supply them at all.

        Whether telemetry arrives as the summary counts below or as per-event records is OPEN
        (ANTI-5); retention is explicitly permitted to be minimal — validate at acceptance and
        keep only compact derived run facts. Retained per-event data is behavioural personal
        data, see `docs/security/data-protection.md` §2A.
      properties:
        run_token: { type: string, description: 'Token from the start call, if that model is adopted.' }
        telemetry: { $ref: '#/components/schemas/RunTelemetry' }
      required: [telemetry]

    RunTelemetry:
      type: object
      description: |
        **UNTRUSTED client-reported hints. Never authoritative.**

        Per the APPROVED achievement progression authority rule, client-reported summary
        counters alone are insufficient for authoritative progression. These values are
        **inputs to server-side derivation**: the server validates the run and derives score,
        paw totals, run facts and achievement progress itself. A value here that the server
        cannot corroborate is discarded, not adopted.
      properties:
        reported_duration_ms: { type: integer, minimum: 0, description: 'Client-measured run duration. Superseded by server-recorded timing where available.' }
        reported_score: { type: integer, minimum: 0, description: 'Client-computed score. Never trusted; the server decides.' }
        reported_run_paws: { type: integer, minimum: 0, description: 'Paws the client believes it collected. Never trusted; derived server-side.' }
        reported_slayyy_activations: { type: integer, minimum: 0, description: 'Hint for the SLAYYY achievements. Not an authoritative total.' }
        reported_loli_activations: { type: integer, minimum: 0, description: 'Hint for ACTUAL Loli Bonus activations — bonuses that ENTERED/ACTIVATED. NOT the count of 200-paw thresholds earned: queued bonuses are run-scoped and can expire unstarted, so the two numbers differ. Never inferable from the paw ledger, and never adopted from this field.' }
        reported_near_miss_count: { type: integer, minimum: 0, description: 'Hint for near-miss achievements. A near miss awards no score and fires at most once per obstacle.' }
        reported_lane_blocking_passes: { type: integer, minimum: 0, description: 'LANE_BLOCKING obstacles the client believes were safely passed. Hint for cone_dodger.' }
        reported_peak_queued_loli_bonuses: { type: integer, minimum: 0, description: 'Run-scoped queue depth, for analysis only. Never persisted as progression and never carried into a future run.' }
      required: [reported_duration_ms, reported_score, reported_run_paws]

    RunResult:
      type: object
      description: |
        The **authoritative** outcome. A flagged run is recorded and excluded from
        ranking pending review; the player is told honestly rather than silently
        ignored.
      properties:
        run_id: { type: string, description: Identifier for the run. }
        status:
          type: string
          description: Validation outcome.
          enum: [accepted, flagged, rejected]
        score: { type: integer, description: Authoritative score. }
        is_personal_best: { type: boolean, description: Whether this beat the previous record. }
        previous_best_score: { type: integer, description: The record before this run. }
        run_paws: { type: integer, description: Authoritative paws for this run. }
        derived_facts: { $ref: '#/components/schemas/RunDerivedFacts' }
        progression: { $ref: '#/components/schemas/Progression' }
        achievements_unlocked:
          type: array
          description: Achievements unlocked by this run.
          items: { $ref: '#/components/schemas/Achievement' }
        characters_unlocked:
          type: array
          description: Characters unlocked by this run.
          items: { $ref: '#/components/schemas/Character' }
      required: [run_id, status, score, run_paws, derived_facts, progression]

    RunDerivedFacts:
      type: object
      description: |
        **AUTHORITATIVE server-derived run facts — the only real numbers.**

        Computed by the server from accepted, validated telemetry. A client cannot supply
        these: they exist only in the response. Every `DERIVED_TELEMETRY` achievement reads
        from here, never from `RunTelemetry`.

        The flow is: client telemetry/events → server validation → these derived run facts →
        persistent lifetime aggregates.
      properties:
        loli_activations:
          type: integer
          minimum: 0
          description: 'Loli Bonuses that ACTUALLY STARTED this run (ENTERING/ACTIVE transition). Not thresholds earned: a queued bonus that expired unstarted at run end does not count. Feeds lolis_favourite, loli_devotee and Sero''s unlock.'
        near_miss_count:
          type: integer
          minimum: 0
          description: 'Near misses this run. At most one per obstacle. Awards no score. Feeds close_call and nerves_of_steel.'
        lane_blocking_passes:
          type: integer
          minimum: 0
          description: 'LANE_BLOCKING obstacles safely passed. A collision neither increments nor resets. Feeds cone_dodger. Named by obstacle CLASS, not artwork: cone is the v1 art for LANE_BLOCKING, and a future variant reuses the class.'
        slayyy_activations:
          type: integer
          minimum: 0
          description: 'SLAYYY activations this run. Feeds slayyy_master and slayyy_double.'
      required: [loli_activations, near_miss_count, lane_blocking_passes, slayyy_activations]

    Progression:
      type: object
      description: |
        The three distinct paw concepts, never collapsed into a generic field.
        Crossing 200 triggers one Loli Bonus per completed threshold, consumes
        200, and preserves overflow.

        **There is deliberately no queued or owed Loli Bonus field.** The Loli Bonus is a
        run-scoped gameplay reward, not a bankable meta-progression currency: queueing lives
        in the client's `RunState` for the duration of a run and ends with it. A threshold
        consumed during a run is never converted into a future-run entitlement.

        Character-unlock criteria are **APPROVED** (AU-4 resolved): Büşo from `best_score`,
        Ogito from accepted `run_count` with **no** duration filter, Sero from
        `lifetime_loli_activations`. The alternative-reading counters `lifetime_score`,
        `max_loli_bonus_in_single_run` and `accepted_runs_above_min_duration` are **retired**.
      properties:
        lifetime_paws: { type: integer, description: Lifetime statistic. Never consumed. }
        loli_cycle_paws:
          type: integer
          minimum: 0
          maximum: 199
          description: Persistent progress toward the next Loli Bonus.
        loli_threshold: { type: integer, description: Always 200. }
        best_score: { type: integer, description: Best single-run score. }
        run_count: { type: integer, description: Completed runs. }
        achievements_unlocked_count: { type: integer, description: Achievements unlocked. }
        lifetime_loli_activations: { type: integer, description: "Lifetime count of ACTUAL Loli Bonus activations, accumulated from each accepted run's loli_activations. Sero's approved unlock criterion (3). Verification source DERIVED_TELEMETRY, progress persistence PERSISTED_AGGREGATE. Not the count of thresholds earned." }
        lifetime_near_misses: { type: integer, description: 'Derived from accepted run telemetry. Feeds near-miss achievements. DERIVED_TELEMETRY source, persisted aggregate.' }
        lifetime_lane_blocking_passes: { type: integer, description: 'Derived from accepted run telemetry. Feeds cone_dodger. DERIVED_TELEMETRY source, persisted aggregate.' }
        lifetime_slayyy_activations: { type: integer, description: 'Derived from accepted run telemetry. Feeds SLAYYY achievements. DERIVED_TELEMETRY source, persisted aggregate.' }
        tutorial_completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: First tutorial completion; null until completed.
      required: [lifetime_paws, loli_cycle_paws, loli_threshold, best_score, run_count]

    TutorialState:
      type: object
      description: Tutorial completion state, persisted to the profile.
      properties:
        tutorial_completed_at: { type: string, format: date-time, description: Completion timestamp. }
      required: [tutorial_completed_at]

    LeaderboardPage:
      type: object
      description: A page of the ranking plus the requesting player's own row.
      properties:
        window: { type: string, enum: [weekly, all_time], description: Which window this page is from. }
        data:
          type: array
          description: Ranked entries for this page.
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
        own_entry: { $ref: '#/components/schemas/LeaderboardEntry' }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [window, data, meta]

    LeaderboardEntry:
      type: object
      description: One ranked row.
      properties:
        rank: { type: integer, description: Position in the ranking. }
        player_id: { type: string, description: Stable identifier. }
        username: { type: string, description: Public display name. }
        score: { type: integer, description: Best single-run score in this window. }
        achieved_at: { type: string, format: date-time, description: When the score was set. }
      required: [rank, player_id, username, score]

    CursorMeta:
      type: object
      description: Cursor pagination metadata. Cursors are opaque and never constructed by clients.
      properties:
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
          description: Cursor for the next page, or null.
        has_more: { type: boolean, description: Whether more pages exist. }
      required: [has_more]

    Achievement:
      type: object
      description: |
        One achievement with this player's progress.

        Progression is **derived server-side** from accepted, validated telemetry and
        authoritative persistent data. A client-reported summary counter is never adopted as
        authoritative progress.

        Two independent classifications are carried, because "stored in the database" is not
        the same as "not derived from telemetry". A lifetime counter built by incrementing a
        telemetry-derived run fact has a **telemetry** verification source.

        The catalogue itself is **PROPOSED** (16 entries) and awaits approval as a whole —
        see `docs/api/endpoints/achievements.md`.
      properties:
        key: { type: string, description: 'Stable machine key, independent of localized display text.' }
        verification_source:
          type: string
          description: 'Where the evidence comes from. DERIVED_PERSISTENT uses authoritative stored progression and run records; DERIVED_TELEMETRY is computed server-side from accepted run telemetry. Client summary counters are never authoritative. Nine of the sixteen proposed achievements are DERIVED_PERSISTENT and seven are DERIVED_TELEMETRY.'
          enum: [DERIVED_PERSISTENT, DERIVED_TELEMETRY]
        progress_persistence:
          type: string
          description: 'How progress is stored after derivation. PERSISTED_AGGREGATE accumulates across runs in an authoritative counter; RUN_FACT is satisfied by a single accepted run. This is independent of verification_source: storing a cumulative total never reclassifies where its evidence came from.'
          enum: [PERSISTED_AGGREGATE, RUN_FACT]
        progress: { type: integer, description: Monotonic progress value. }
        target: { type: integer, description: Value at which it unlocks. }
        unlocked_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Unlock time, or null if still locked.
        is_hidden: { type: boolean, description: Whether the reward is hidden until unlocked. }
      required: [key, progress, target, is_hidden]

    Character:
      type: object
      description: |
        A character and its unlock state. Selectable only when the criterion is
        met **and** approved artwork exists.
      properties:
        key: { type: string, description: Stable catalogue key. }
        is_unlocked: { type: boolean, description: Whether the player met the criterion. }
        artwork_available: { type: boolean, description: Whether approved artwork exists. }
        is_selectable: { type: boolean, description: True only when both gates are satisfied. }
        unlock_criterion:
          type: string
          description: Human-readable criterion. Semantics are OPEN (AU-4).
      required: [key, is_unlocked, artwork_available, is_selectable]

    Profile:
      type: object
      description: Player profile and settings, as shown on v0.3 boards 17 and 18.
      properties:
        player: { $ref: '#/components/schemas/Player' }
        progression: { $ref: '#/components/schemas/Progression' }
        favourite_character_key: { type: string, description: Selected character. }
        settings: { $ref: '#/components/schemas/Settings' }
      required: [player, progression, settings]

    Settings:
      type: object
      description: |
        Player settings.

        **Audio Option C — APPROVED (#10 resolved).** Settings owns music and SFX **volume
        sliders**; Pause exposes **quick mute/unmute** for each. v0.3 contradicted itself on
        this, and Option C deliberately deviates from both boards.

        **Mute is stored independently of volume**, so unmuting restores the previous non-zero
        level. Mute is never represented as `volume = 0`, which would destroy the level the
        player chose. A muted channel is silent regardless of its stored volume.
      properties:
        locale: { $ref: '#/components/schemas/Locale' }
        music_volume: { type: number, minimum: 0, maximum: 1, description: 'Music volume, set by the Settings slider.' }
        music_muted: { type: boolean, description: 'Music mute, toggled from Pause. Independent of music_volume.' }
        effects_volume: { type: number, minimum: 0, maximum: 1, description: 'Sound-effects volume, set by the Settings slider.' }
        effects_muted: { type: boolean, description: 'Effects mute, toggled from Pause. Independent of effects_volume.' }
        reduced_motion: { type: boolean, description: Calms animations; also respects the OS preference. }
      required: [locale, music_volume, music_muted, effects_volume, effects_muted, reduced_motion]
